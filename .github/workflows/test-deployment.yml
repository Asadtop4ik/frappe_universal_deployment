# ============================================
# FRAPPE_UNIVERSAL_DEPLOY TEST WORKFLOW
# ============================================
# Purpose: Test deployment script on clean DigitalOcean droplet
# Trigger: Manual or on push to main
#
# SETUP REQUIRED:
# GitHub Settings → Secrets → Actions:
#   - DO_DROPLET_IP (Fresh Ubuntu 24.04 droplet IP)
#   - DO_SSH_PRIVATE_KEY (SSH key for root access)
#   - TEST_SITE_NAME (e.g., test.example.com)
#   - TEST_ADMIN_PASSWORD
#   - TEST_MARIADB_ROOT_PASSWORD
# ============================================

name: Test Deployment

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      destroy_droplet:
        description: 'Destroy droplet after test?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - '.env.example'

jobs:
  test-deploy:
    name: Test Deployment on Clean Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ============================================
      # 1. CHECKOUT CODE
      # ============================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ============================================
      # 2. SETUP SSH
      # ============================================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_DROPLET_IP }} >> ~/.ssh/known_hosts

      # ============================================
      # 3. VALIDATE SECRETS
      # ============================================
      - name: Validate Configuration
        run: |
          echo "🔍 Validating required secrets..."
          
          MISSING_SECRETS=()
          
          [ -z "${{ secrets.DO_DROPLET_IP }}" ] && MISSING_SECRETS+=("DO_DROPLET_IP")
          [ -z "${{ secrets.DO_SSH_PRIVATE_KEY }}" ] && MISSING_SECRETS+=("DO_SSH_PRIVATE_KEY")
          [ -z "${{ secrets.TEST_SITE_NAME }}" ] && MISSING_SECRETS+=("TEST_SITE_NAME")
          [ -z "${{ secrets.TEST_ADMIN_PASSWORD }}" ] && MISSING_SECRETS+=("TEST_ADMIN_PASSWORD")
          [ -z "${{ secrets.TEST_MARIADB_ROOT_PASSWORD }}" ] && MISSING_SECRETS+=("TEST_MARIADB_ROOT_PASSWORD")
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Missing required secrets:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            exit 1
          fi
          
          echo "✅ All required secrets configured"

      # ============================================
      # 4. CHECK SERVER STATUS
      # ============================================
      - name: Check Server Status
        run: |
          echo "🖥️  Server Information:"
          ssh root@${{ secrets.DO_DROPLET_IP }} << 'EOF'
            echo "Hostname: $(hostname)"
            echo "OS: $(lsb_release -ds)"
            echo "Kernel: $(uname -r)"
            echo "CPU: $(nproc) cores"
            echo "RAM: $(free -h | grep Mem | awk '{print $2}')"
            echo "Disk: $(df -h / | tail -1 | awk '{print $2}')"
          EOF

      # ============================================
      # 5. DEPLOY PROJECT TO SERVER
      # ============================================
      - name: Copy Deployment Files
        run: |
          echo "📦 Uploading deployment files..."
          
          # Create deployment directory
          ssh root@${{ secrets.DO_DROPLET_IP }} "mkdir -p /tmp/frappe_deploy"
          
          # Upload all necessary files
          scp -r deploy/ root@${{ secrets.DO_DROPLET_IP }}:/tmp/frappe_deploy/
          scp .env.example root@${{ secrets.DO_DROPLET_IP }}:/tmp/frappe_deploy/.env.example
          
          echo "✅ Files uploaded"

      # ============================================
      # 6. CONFIGURE ENVIRONMENT
      # ============================================
      - name: Configure Environment
        run: |
          echo "⚙️  Configuring .env file..."
          
          ssh root@${{ secrets.DO_DROPLET_IP }} << 'EOF'
            cd /tmp/frappe_deploy
            
            # Create .env from template
            cp .env.example .env
            
            # Configure basic settings
            sed -i "s/SITE_NAME=.*/SITE_NAME=${{ secrets.TEST_SITE_NAME }}/" .env
            sed -i "s/ADMIN_PASSWORD=.*/ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}/" .env
            sed -i "s/MARIADB_ROOT_PASSWORD=.*/MARIADB_ROOT_PASSWORD=${{ secrets.TEST_MARIADB_ROOT_PASSWORD }}/" .env
            
            # Test mode: frappe, erpnext only (no custom apps)
            sed -i "s/APPS_TO_INSTALL=.*/APPS_TO_INSTALL=frappe,erpnext/" .env
            sed -i "s/CUSTOM_APP_REPO=.*/CUSTOM_APP_REPO=/" .env
            
            echo "✅ .env configured"
            echo "Site Name: ${{ secrets.TEST_SITE_NAME }}"
          EOF

      # ============================================
      # 7. RUN DEPLOYMENT
      # ============================================
      - name: Execute Deployment Script
        run: |
          echo "🚀 Starting deployment..."
          echo "⏱️  Estimated time: 15-20 minutes"
          
          ssh root@${{ secrets.DO_DROPLET_IP }} << 'EOF'
            cd /tmp/frappe_deploy
            bash deploy/deploy.sh 2>&1 | tee deployment.log
          EOF
          
          echo "✅ Deployment completed"

      # ============================================
      # 8. VERIFY INSTALLATION
      # ============================================
      - name: Verify Installation
        run: |
          echo "🔍 Verifying installation..."
          
          ssh root@${{ secrets.DO_DROPLET_IP }} << 'EOF'
            set -e
            
            echo "1️⃣ Checking frappe user..."
            id frappe
            
            echo ""
            echo "2️⃣ Checking bench installation..."
            su - frappe -c "bench --version"
            
            echo ""
            echo "3️⃣ Checking installed apps..."
            su - frappe -c "cd /home/frappe/frappe-bench && bench version"
            
            echo ""
            echo "4️⃣ Checking site status..."
            su - frappe -c "cd /home/frappe/frappe-bench && bench --site ${{ secrets.TEST_SITE_NAME }} list-apps"
            
            echo ""
            echo "5️⃣ Checking services..."
            systemctl status mariadb --no-pager | grep Active
            systemctl status redis-server --no-pager | grep Active
            systemctl status nginx --no-pager | grep Active
            systemctl status supervisor --no-pager | grep Active
            
            echo ""
            echo "6️⃣ Checking supervisor processes..."
            supervisorctl status
            
            echo ""
            echo "7️⃣ Checking firewall..."
            ufw status numbered
          EOF
          
          echo "✅ All checks passed!"

      # ============================================
      # 9. TEST HTTP ACCESS
      # ============================================
      - name: Test HTTP Access
        run: |
          echo "🌐 Testing HTTP access..."
          
          SITE_URL="http://${{ secrets.DO_DROPLET_IP }}"
          
          echo "Waiting 5 seconds for services to stabilize..."
          sleep 5
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $SITE_URL || echo "000")
          
          echo "HTTP Response Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Site is accessible!"
          else
            echo "❌ Site not accessible!"
            echo "Checking nginx logs..."
            ssh root@${{ secrets.DO_DROPLET_IP }} "tail -20 /var/log/nginx/error.log"
            exit 1
          fi

      # ============================================
      # 10. COLLECT LOGS
      # ============================================
      - name: Collect Logs
        if: always()
        run: |
          echo "📋 Collecting logs..."
          
          ssh root@${{ secrets.DO_DROPLET_IP }} << 'EOF'
            echo "=== Deployment Log ==="
            tail -100 /tmp/frappe_deploy/deployment.log || echo "No deployment log"
            
            echo ""
            echo "=== Nginx Error Log ==="
            tail -50 /var/log/nginx/error.log || echo "No nginx errors"
            
            echo ""
            echo "=== Bench Logs ==="
            su - frappe -c "cd /home/frappe/frappe-bench && bench --site ${{ secrets.TEST_SITE_NAME }} logs 2>&1 | tail -50" || echo "No bench logs"
          EOF

      # ============================================
      # 11. SEND RESULTS
      # ============================================
      - name: Test Results Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ TEST PASSED!"
            echo ""
            echo "🎉 Deployment script working perfectly!"
            echo "📍 Server: ${{ secrets.DO_DROPLET_IP }}"
            echo "🌐 Site: http://${{ secrets.DO_DROPLET_IP }}"
            echo "👤 Admin: Administrator"
            echo "🔑 Password: (from TEST_ADMIN_PASSWORD secret)"
          else
            echo "❌ TEST FAILED!"
            echo ""
            echo "Check logs above for details"
          fi

# ============================================
# NEXT STEPS AFTER SUCCESSFUL TEST:
# ============================================
# 1. Git tag the release: git tag v1.0.0 && git push --tags
# 2. Update README with test results
# 3. Share repository with team
# 4. Setup production deployment workflow
# ============================================
